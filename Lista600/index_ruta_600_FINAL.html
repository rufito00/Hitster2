<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitster</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(92%,420px);padding:30px 24px;border:1px solid #29293a;border-radius:24px;background:#171722;text-align:center;box-shadow:0 20px 60px #0008}
.disc{width:200px;height:200px;margin:auto;border-radius:50%;background:repeating-radial-gradient(circle,#3a3a3a 0 2px,#181818 3px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.playing{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:34px}.hint{font-size:13px;color:#aaa;margin-top:6px}
button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.4}
#status{min-height:20px;margin-top:16px;color:#aaa;font-size:14px}.error{color:#ff7070!important}
.answer{display:none;margin-top:22px}.answer.show{display:block}
.year{font-size:42px;font-weight:800;color:#1db954}.title{font-size:21px;font-weight:700;margin-top:5px}.artist{color:#aaa;margin-top:4px}
#home{display:none}.route-title{font-size:24px;font-weight:800;margin-bottom:8px}.route-info{color:#aaa;font-size:13px;margin-bottom:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="card">

<div id="home">
  <div class="route-title">🎵 Hitster</div>
  <div class="route-info">Ruta 600 · Canciones conocidas en España</div>
  <button id="random">🎲 CANCIÓN ALEATORIA</button>
  <button id="qr">📷 JUGAR CON QR</button>
  <div id="homeStatus" style="margin-top:16px;color:#aaa;font-size:13px">Cargando lista...</div>
</div>

<div id="game">
  <div id="routeLabel" class="route-info"></div>
  <div class="disc" id="disc"><div class="icon" id="icon">▶</div><div class="hint" id="hint">Cargando carta...</div></div>
  <button id="reveal" disabled>🔍 Revelar</button>
  <button id="gameRandom">🎲 CANCIÓN ALEATORIA</button>
  <div id="status"></div>
  <div class="answer" id="answer">
    <div class="year" id="year"></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
  </div>
  <button id="next" class="hidden">➡️ OTRA ALEATORIA</button>
  <button id="back" class="hidden">⬅️ Volver</button>
</div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const ROUTE_FILE="./hitster_600_superconocidas_espana.json";
const p=new URLSearchParams(location.search);
const id=(p.get("id")||"").trim();

const home=document.getElementById("home"),game=document.getElementById("game");
const routeLabel=document.getElementById("routeLabel"),status=document.getElementById("status");
const disc=document.getElementById("disc"),icon=document.getElementById("icon"),hint=document.getElementById("hint");
const reveal=document.getElementById("reveal"),answer=document.getElementById("answer");
const audio=document.getElementById("audio");

let list=[],song=null,preview=null,playing=false;

function norm(s){
 return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}

function jsonp(url,timeout=9000){
 return new Promise((resolve,reject)=>{
  const cb="hitster_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const s=document.createElement("script");let done=false;
  const timer=setTimeout(()=>fail(new Error("timeout")),timeout);
  function clean(){clearTimeout(timer);delete window[cb];s.remove()}
  function fail(e){if(done)return;done=true;clean();reject(e)}
  window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
  s.onerror=()=>fail(new Error("network"));
  s.src=url+"&callback="+encodeURIComponent(cb);
  document.body.appendChild(s);
 });
}

async function loadList(){
 const r=await fetch(ROUTE_FILE+"?x="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw new Error("No se puede cargar la lista de 600 ("+r.status+")");
 list=await r.json();
 if(!Array.isArray(list)||!list.length)throw new Error("La lista de 600 no es válida");
 document.getElementById("homeStatus").textContent=list.length+" canciones disponibles";
}

async function getPreview(){
 const q=encodeURIComponent(song.artist+" "+song.title);
 try{
   const d=await jsonp("https://api.deezer.com/search?q="+q+"&limit=25&output=jsonp");
   const t=norm(song.title),a=norm(song.artist);
   let arr=(d.data||[]).filter(x=>x.preview);
   arr.sort((x,y)=>{
     const score=z=>(norm(z.title)===t?100:0)+(norm(z.artist?.name)===a?100:0);
     return score(y)-score(x);
   });
   if(arr.length)return arr[0].preview;
 }catch(e){console.warn("Deezer:",e)}

 const u="https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=25&country=ES&lang=es_es";
 const i=await jsonp(u);
 let arr=(i.results||[]).filter(x=>x.previewUrl);
 const t=norm(song.title),a=norm(song.artist);
 arr.sort((x,y)=>{
   const score=z=>(norm(z.trackName)===t?100:0)+(norm(z.artistName)===a?100:0);
   return score(y)-score(x);
 });
 if(!arr.length)throw new Error("Sin preview disponible");
 return arr[0].previewUrl;
}

async function showSong(s,randomMode=false){
 song=s; preview=null;
 home.style.display="none";game.style.display="block";
 routeLabel.textContent="Ruta 600 · Canciones conocidas en España";
 answer.classList.remove("show");
 reveal.disabled=true;
 status.textContent="";
 status.className="";
 icon.textContent="▶";hint.textContent="Buscando canción...";
 disc.classList.remove("playing");
 audio.pause();playing=false;

 document.getElementById("year").textContent=song.year||"";
 document.getElementById("title").textContent=song.title||"";
 document.getElementById("artist").textContent=song.artist||"";

 try{
   preview=await getPreview();
   audio.src=preview;audio.load();
   hint.textContent="Toca para reproducir";
   reveal.disabled=false;
 }catch(e){
   status.textContent=e.message;status.className="error";hint.textContent="No disponible";
 }

 document.getElementById("next").classList.toggle("hidden",!randomMode);
 document.getElementById("back").classList.toggle("hidden",!randomMode);
}

function randomSong(){
 const s=list[Math.floor(Math.random()*list.length)];
 showSong(s,true);
}

disc.onclick=async()=>{
 if(!preview)return;
 try{
   if(!playing){
     await audio.play();playing=true;disc.classList.add("playing");
     icon.textContent="🔊";hint.textContent="Sonando...";
   }else{
     audio.pause();playing=false;disc.classList.remove("playing");
     icon.textContent="▶";hint.textContent="Toca para reanudar";
   }
 }catch(e){
   status.textContent="Toca otra vez el disco para iniciar el audio.";
   status.className="error";
 }
};

audio.onended=()=>{
 playing=false;disc.classList.remove("playing");
 icon.textContent="▶";hint.textContent="Toca para volver a escuchar";
};
audio.onerror=()=>{
 status.textContent="La fuente de audio no permite reproducir este preview.";
 status.className="error";playing=false;disc.classList.remove("playing");
};

reveal.onclick=()=>{
 answer.classList.add("show");reveal.disabled=true;
};

document.getElementById("random").onclick=randomSong;
document.getElementById("gameRandom").onclick=randomSong;
document.getElementById("next").onclick=randomSong;
document.getElementById("back").onclick=()=>{
 audio.pause();game.style.display="none";home.style.display="block";
};

document.getElementById("qr").onclick=()=>{
 alert("Para jugar con QR, escanea una carta de la ruta 600. La URL debe incluir ?id=001, ?id=002, etc.");
};

async function init(){
 try{
   await loadList();
   if(id){
     const wanted=String(id).padStart(3,"0");
     song=list.find(x=>String(x.id).padStart(3,"0")===wanted);
     if(!song)throw new Error("No existe la carta "+wanted+" en la ruta de 600");
     await showSong(song,false);
   }else{
     home.style.display="block";
   }
 }catch(e){
   home.style.display="block";
   document.getElementById("homeStatus").textContent=e.message;
   document.getElementById("homeStatus").className="error";
 }
}
init();
</script>
</body>
</html>
