<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitster — Lista 600</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(92%,420px);padding:30px 24px;border:1px solid #29293a;border-radius:24px;background:#171722;text-align:center;box-shadow:0 20px 60px #0008}
h1{font-size:25px;margin:0 0 18px}
.sub{color:#aaa;font-size:14px;margin-bottom:18px}
.disc{width:200px;height:200px;margin:auto;border-radius:50%;background:repeating-radial-gradient(circle,#3a3a3a 0 2px,#181818 3px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:34px}.hint{font-size:13px;color:#aaa;margin-top:6px}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:16px;font-weight:700}
button.primary{background:#1db954;color:#071108}
button:disabled{opacity:.4}
#status{min-height:20px;margin-top:16px;color:#aaa;font-size:14px}.error{color:#ff7070!important}
 .category{display:inline-block;margin:16px auto 10px;padding:10px 18px;border-radius:20px;font-size:17px;font-weight:800}
.home-category{min-height:48px;margin:12px 0;font-size:19px;font-weight:800}
.question{min-height:48px;font-size:20px;font-weight:700;margin:8px 0 4px}
.cat-green{background:#39d353;color:#061007}.cat-yellow{background:#ffd928;color:#171300}
.cat-pink{background:#ff7eb6;color:#21000f}.cat-purple{background:#9b6cff;color:#fff}
.cat-blue{background:#3298ff;color:#fff}
.answer{display:none;margin-top:22px}.answer.show{display:block}
.year{font-size:42px;font-weight:800;color:#1db954}.title{font-size:21px;font-weight:700;margin-top:5px}.artist{color:#aaa;margin-top:4px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="home">
    <h1>🎵 HITSTER</h1>
    <div class="sub">Ruta de 600 canciones conocidas en España</div>
    <button class="primary" id="randomHome">🎲 CANCIÓN ALEATORIA</button>
    <button id="categoryHome">🎯 CATEGORÍA ALEATORIA</button>
    <div id="homeCategory" class="home-category"></div>
    <button id="qrInfo">📷 JUGAR CON QR</button>
  </div>

  <div id="game" class="hidden">
    <div class="disc" id="disc">
      <div class="icon" id="icon">▶</div>
      <div class="hint" id="hint">Cargando carta...</div>
    </div>

    <div id="category" class="category" style="display:none"></div>
    <div id="question" class="question"></div>
    <button id="categoryGame">🎯 OTRA CATEGORÍA</button>
    <button id="reveal" disabled>🔍 Revelar</button>
    <button id="gameRandom">🎲 OTRA ALEATORIA</button>
    <button id="back">⬅️ Volver</button>

    <div id="status"></div>
    <div class="answer" id="answer">
      <div class="year" id="year"></div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const ROUTE_FILE="./hitster_600_superconocidas_espana.json";
const p=new URLSearchParams(location.search);
const id=(p.get("id")||"").trim().padStart(3,"0");

const home=document.getElementById("home");
const game=document.getElementById("game");
const randomHome=document.getElementById("randomHome");
const qrInfo=document.getElementById("qrInfo");
const gameRandom=document.getElementById("gameRandom");
const categoryHome=document.getElementById("categoryHome");
const categoryGame=document.getElementById("categoryGame");
const back=document.getElementById("back");
const status=document.getElementById("status");
const disc=document.getElementById("disc");
const icon=document.getElementById("icon");
const hint=document.getElementById("hint");
const reveal=document.getElementById("reveal");
const answer=document.getElementById("answer");
const audio=document.getElementById("audio");

let list=[];
let song=null;
let preview=null;
let playing=false;
let currentCategory=null;
const categories=[
 {key:"group",emoji:"💚",name:"Grupo o solista",cls:"cat-green",question:"¿Cuál es el grupo o solista?"},
 {key:"title",emoji:"💛",name:"Título de la canción",cls:"cat-yellow",question:"¿Cuál es el título de la canción?"},
 {key:"exact",emoji:"🩷",name:"Año exacto",cls:"cat-pink",question:"¿En qué año exacto salió la canción?"},
 {key:"decade",emoji:"💜",name:"Año o década",cls:"cat-purple",question:"¿En qué año o década salió la canción?"},
 {key:"plusminus",emoji:"💙",name:"±3 años",cls:"cat-blue",question:"¿En qué año salió? Se acepta ±3 años."}
];
function chooseCategory(){
 currentCategory=categories[Math.floor(Math.random()*categories.length)];
 const el=document.getElementById("category");
 el.textContent=currentCategory.emoji+" "+currentCategory.name;
 el.className="category "+currentCategory.cls;
 el.style.display="inline-block";
 document.getElementById("question").textContent=currentCategory.question;
}

function chooseHomeCategory(){
 const c=categories[Math.floor(Math.random()*categories.length)];
 const el=document.getElementById("homeCategory");
 el.textContent=c.emoji+" "+c.name;
 el.className="home-category "+c.cls;
}
async function init(){
  try{
    await loadList();

    if(!id){
      home.classList.remove("hidden");
      game.classList.add("hidden");
      return;
    }

    song=list.find(x=>String(x.id).padStart(3,"0")===id);
    if(!song)throw new Error("No existe la carta "+id);

    home.classList.add("hidden");
    game.classList.remove("hidden");

    document.getElementById("year").textContent=song.year;
    document.getElementById("title").textContent=song.title;
    document.getElementById("artist").textContent=song.artist;

    status.textContent="Buscando canción...";
    try{preview=await deezer()}catch(e){console.warn("Deezer:",e);preview=await itunes()}

    audio.src=preview;
    audio.load();
    status.textContent="";
    hint.textContent="Toca para reproducir";
    reveal.disabled=false;
  }catch(e){
    console.error(e);
    status.textContent=e.message;
    status.className="error";
    hint.textContent="No disponible";
  }
}

disc.onclick=async()=>{
  if(!preview)return;
  try{
    if(!playing){
      await audio.play();
      playing=true;
      disc.classList.add("playing");
      icon.textContent="🔊";
      hint.textContent="Sonando...";
    }else{
      audio.pause();
      playing=false;
      disc.classList.remove("playing");
      icon.textContent="▶";
      hint.textContent="Toca para reanudar";
    }
  }catch(e){
    status.textContent="Toca otra vez el disco para iniciar el audio.";
    status.className="error";
  }
};

audio.onended=()=>{
  playing=false;
  disc.classList.remove("playing");
  icon.textContent="▶";
  hint.textContent="Toca para volver a escuchar";
};

audio.onerror=()=>{
  status.textContent="La fuente de audio no permite reproducir este preview.";
  status.className="error";
  playing=false;
  disc.classList.remove("playing");
};

reveal.onclick=()=>{
  answer.classList.add("show");
  reveal.disabled=true;
};

randomHome.onclick=randomSong;
gameRandom.onclick=randomSong;
categoryHome.onclick=chooseHomeCategory;
categoryGame.onclick=()=>{
  chooseCategory();
  reveal.disabled=false;
};
back.onclick=()=>{location.href="./";};
qrInfo.onclick=()=>alert("Escanea un QR de la Ruta 600 para abrir una canción directamente.");

init();
</script>
</body>
</html>
