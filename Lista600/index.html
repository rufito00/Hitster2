<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitster — Lista 600</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(92%,420px);padding:30px 24px;border:1px solid #29293a;border-radius:24px;background:#171722;text-align:center;box-shadow:0 20px 60px #0008}
h1{font-size:25px;margin:0 0 18px}
.sub{color:#aaa;font-size:14px;margin-bottom:18px}
.disc{width:200px;height:200px;margin:auto;border-radius:50%;background:repeating-radial-gradient(circle,#3a3a3a 0 2px,#181818 3px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:34px}.hint{font-size:13px;color:#aaa;margin-top:6px}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:16px;font-weight:700}
button.primary{background:#1db954;color:#071108}
button:disabled{opacity:.4}
#status{min-height:20px;margin-top:16px;color:#aaa;font-size:14px}.error{color:#ff7070!important}
.answer{display:none;margin-top:22px}.answer.show{display:block}
.year{font-size:42px;font-weight:800;color:#1db954}.title{font-size:21px;font-weight:700;margin-top:5px}.artist{color:#aaa;margin-top:4px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="home">
    <h1>🎵 HITSTER</h1>
    <div class="sub">Ruta de 600 canciones conocidas en España</div>
    <button class="primary" id="randomHome">🎲 CANCIÓN ALEATORIA</button>
    <button id="qrInfo">📷 JUGAR CON QR</button>
  </div>

  <div id="game" class="hidden">
    <div class="disc" id="disc">
      <div class="icon" id="icon">▶</div>
      <div class="hint" id="hint">Cargando carta...</div>
    </div>

    <button id="reveal" disabled>🔍 Revelar</button>
    <button id="gameRandom">🎲 CANCIÓN ALEATORIA</button>
    <button id="back">⬅️ Volver</button>

    <div id="status"></div>
    <div class="answer" id="answer">
      <div class="year" id="year"></div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const ROUTE_FILE="./hitster_600_superconocidas_espana.json";
const p=new URLSearchParams(location.search);
const id=(p.get("id")||"").trim().padStart(3,"0");

const home=document.getElementById("home");
const game=document.getElementById("game");
const randomHome=document.getElementById("randomHome");
const qrInfo=document.getElementById("qrInfo");
const gameRandom=document.getElementById("gameRandom");
const back=document.getElementById("back");
const status=document.getElementById("status");
const disc=document.getElementById("disc");
const icon=document.getElementById("icon");
const hint=document.getElementById("hint");
const reveal=document.getElementById("reveal");
const answer=document.getElementById("answer");
const audio=document.getElementById("audio");

let list=[];
let song=null;
let preview=null;
let playing=false;

function norm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}

async function loadList(){
  const r=await fetch(ROUTE_FILE+"?x="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("No se puede cargar la lista ("+r.status+")");
  list=await r.json();
  if(!Array.isArray(list)||!list.length) throw new Error("La lista está vacía");
}

function goTo(idValue){
  location.href="?id="+String(idValue).padStart(3,"0");
}

function randomSong(){
  if(!list.length)return;
  const picked=list[Math.floor(Math.random()*list.length)];
  goTo(picked.id);
}

async function jsonp(url,timeout=9000){
  return new Promise((resolve,reject)=>{
    const cb="hitster_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let done=false;
    const clean=()=>{clearTimeout(timer);delete window[cb];s.remove()};
    const fail=e=>{if(done)return;done=true;clean();reject(e)};
    const timer=setTimeout(()=>fail(new Error("timeout")),timeout);
    window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
    s.onerror=()=>fail(new Error("network"));
    s.src=url+"&callback="+cb;
    document.body.appendChild(s);
  });
}

async function deezer(){
  const q=encodeURIComponent(song.artist+" "+song.title);
  const d=await jsonp("https://api.deezer.com/search?q="+q+"&limit=25&output=jsonp");
  const t=norm(song.title),a=norm(song.artist);
  const arr=(d.data||[]).filter(x=>x.preview);
  arr.sort((x,y)=>{
    const sx=(norm(x.title)===t?100:0)+(norm(x.artist?.name)===a?100:0);
    const sy=(norm(y.title)===t?100:0)+(norm(y.artist?.name)===a?100:0);
    return sy-sx;
  });
  if(!arr.length)throw new Error("Sin preview en Deezer");
  return arr[0].preview;
}

async function itunes(){
  const q=encodeURIComponent(song.artist+" "+song.title);
  const u="https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=25&country=ES&lang=es_es";
  const d=await jsonp(u);
  const t=norm(song.title),a=norm(song.artist);
  const arr=(d.results||[]).filter(x=>x.previewUrl);
  arr.sort((x,y)=>{
    const sx=(norm(x.trackName)===t?100:0)+(norm(x.artistName)===a?100:0);
    const sy=(norm(y.trackName)===t?100:0)+(norm(y.artistName)===a?100:0);
    return sy-sx;
  });
  if(!arr.length)throw new Error("Sin preview en iTunes");
  return arr[0].previewUrl;
}

async function init(){
  try{
    await loadList();

    if(!id){
      home.classList.remove("hidden");
      game.classList.add("hidden");
      return;
    }

    song=list.find(x=>String(x.id).padStart(3,"0")===id);
    if(!song)throw new Error("No existe la carta "+id);

    home.classList.add("hidden");
    game.classList.remove("hidden");

    document.getElementById("year").textContent=song.year;
    document.getElementById("title").textContent=song.title;
    document.getElementById("artist").textContent=song.artist;

    status.textContent="Buscando canción...";
    try{preview=await deezer()}catch(e){console.warn("Deezer:",e);preview=await itunes()}

    audio.src=preview;
    audio.load();
    status.textContent="";
    hint.textContent="Toca para reproducir";
    reveal.disabled=false;
  }catch(e){
    console.error(e);
    status.textContent=e.message;
    status.className="error";
    hint.textContent="No disponible";
  }
}

disc.onclick=async()=>{
  if(!preview)return;
  try{
    if(!playing){
      await audio.play();
      playing=true;
      disc.classList.add("playing");
      icon.textContent="🔊";
      hint.textContent="Sonando...";
    }else{
      audio.pause();
      playing=false;
      disc.classList.remove("playing");
      icon.textContent="▶";
      hint.textContent="Toca para reanudar";
    }
  }catch(e){
    status.textContent="Toca otra vez el disco para iniciar el audio.";
    status.className="error";
  }
};

audio.onended=()=>{
  playing=false;
  disc.classList.remove("playing");
  icon.textContent="▶";
  hint.textContent="Toca para volver a escuchar";
};

audio.onerror=()=>{
  status.textContent="La fuente de audio no permite reproducir este preview.";
  status.className="error";
  playing=false;
  disc.classList.remove("playing");
};

reveal.onclick=()=>{
  answer.classList.add("show");
  reveal.disabled=true;
};

randomHome.onclick=randomSong;
gameRandom.onclick=randomSong;
back.onclick=()=>{location.href="./";};
qrInfo.onclick=()=>alert("Escanea un QR de la Ruta 600 para abrir una canción directamente.");

init();
</script>
</body>
</html>
