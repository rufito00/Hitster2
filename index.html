<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1e1e2f,#0a0a12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
.card{width:90%;max-width:420px;background:#15151f;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #2a2a3a}
.disc{width:200px;height:200px;margin:0 auto 24px;border-radius:50%;background:repeating-radial-gradient(circle,#333 0,#333 2px,#1a1a1a 3px,#1a1a1a 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:manipulation}
.disc.playing{animation:spin 6s linear infinite}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.icon{font-size:34px}.hint{font-size:12px;color:#999;margin-top:6px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:600;margin-top:12px;cursor:pointer;background:#2a2a3a;color:#fff}
button:disabled{opacity:.4;cursor:default}
.reveal{margin-top:20px;display:none}.reveal.show{display:block}.year{font-size:40px;font-weight:800;color:#1DB954}.title{font-size:20px;font-weight:700;margin-top:6px}.artist{font-size:15px;color:#999;margin-top:2px}
.error{color:#ff6b6b;font-size:14px;margin-top:16px;line-height:1.4}.loading{color:#888;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="disc" id="disc">
    <div class="icon" id="icon">▶</div>
    <div class="hint" id="hint">Cargando carta...</div>
  </div>
  <button id="revealBtn" disabled>🔍 Revelar</button>
  <div class="reveal" id="revealBox">
    <div class="year" id="revealYear"></div>
    <div class="title" id="revealTitle"></div>
    <div class="artist" id="revealArtist"></div>
  </div>
  <div class="loading" id="loadingMsg"></div>
  <div class="error" id="errorMsg"></div>
</div>
<audio id="audioPlayer" preload="none"></audio>

<script>
const params = new URLSearchParams(location.search);
const id = (params.get("id") || "").trim().padStart(3,"0");
const country = (params.get("c") || "ES").trim().toUpperCase();

const disc = document.getElementById("disc");
const icon = document.getElementById("icon");
const hint = document.getElementById("hint");
const revealBtn = document.getElementById("revealBtn");
const revealBox = document.getElementById("revealBox");
const revealYear = document.getElementById("revealYear");
const revealTitle = document.getElementById("revealTitle");
const revealArtist = document.getElementById("revealArtist");
const loadingMsg = document.getElementById("loadingMsg");
const errorMsg = document.getElementById("errorMsg");
const audio = document.getElementById("audioPlayer");

let song = null;
let previewUrl = null;
let playing = false;

function jsonp(url, timeout=10000){
  return new Promise((resolve,reject)=>{
    const cb = "__hitster_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let finished = false;

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }
    function fail(message){
      if(finished) return;
      finished = true;
      cleanup();
      reject(new Error(message));
    }

    const timer = setTimeout(()=>fail("TIMEOUT"), timeout);

    window[cb] = data => {
      if(finished) return;
      finished = true;
      cleanup();
      resolve(data);
    };

    script.onerror = ()=>fail("NETWORK");
    script.src = url + "&callback=" + encodeURIComponent(cb);
    document.body.appendChild(script);
  });
}

async function loadSong(){
  if(!id){
    throw new Error("NO_ID");
  }

  const response = await fetch("songs.json", {cache:"no-store"});
  if(!response.ok) throw new Error("SONGS_FILE");

  const songs = await response.json();
  song = songs.find(s => String(s.id).padStart(3,"0") === id);

  if(!song) throw new Error("SONG_NOT_FOUND");

  revealYear.textContent = song.year;
  revealTitle.textContent = song.title;
  revealArtist.textContent = song.artist;

  loadingMsg.textContent = "Buscando preview...";
  const term = encodeURIComponent(song.artist + " " + song.title);

  const url =
    "https://itunes.apple.com/search" +
    "?term=" + term +
    "&media=music" +
    "&entity=song" +
    "&limit=25" +
    "&country=" + encodeURIComponent(country) +
    "&lang=es_es";

  const data = await jsonp(url);

  if(!data || !Array.isArray(data.results)) {
    throw new Error("ITUNES_RESPONSE");
  }

  const normalize = s => (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ").trim();

  const wantedTitle = normalize(song.title);
  const wantedArtist = normalize(song.artist);

  function score(r){
    const t = normalize(r.trackName);
    const a = normalize(r.artistName);
    let n = 0;
    if(t === wantedTitle) n += 100;
    else if(t.includes(wantedTitle) || wantedTitle.includes(t)) n += 60;
    if(a === wantedArtist) n += 100;
    else if(a.includes(wantedArtist) || wantedArtist.includes(a)) n += 60;
    if(r.previewUrl) n += 20;
    return n;
  }

  const results = data.results.filter(r => r.previewUrl).sort((a,b)=>score(b)-score(a));

  if(!results.length) throw new Error("NO_PREVIEW");

  previewUrl = results[0].previewUrl;
  audio.src = previewUrl;
  audio.load();

  loadingMsg.textContent = "";
  hint.textContent = "Toca para reproducir";
  revealBtn.disabled = false;
}

function showError(e){
  loadingMsg.textContent = "";
  if(e.message === "NO_ID"){
    errorMsg.textContent = "Esta carta necesita una URL como ?id=006";
  } else if(e.message === "SONGS_FILE"){
    errorMsg.textContent = "No encuentro songs.json. Súbelo al mismo sitio que index.html.";
  } else if(e.message === "SONG_NOT_FOUND"){
    errorMsg.textContent = "No existe la carta " + id + " en songs.json.";
  } else if(e.message === "NO_PREVIEW"){
    errorMsg.textContent = "La carta está bien, pero iTunes no ofrece un preview reproducible.";
  } else {
    errorMsg.textContent = "No puedo cargar la canción ahora. Comprueba que index.html y songs.json estén publicados.";
  }
  hint.textContent = "No disponible";
}

disc.addEventListener("click", async()=>{
  if(!previewUrl) return;
  if(!playing){
    try{
      await audio.play();
      playing=true;
      disc.classList.add("playing");
      icon.textContent="🔊";
      hint.textContent="Sonando...";
    }catch(e){
      errorMsg.textContent="Safari ha bloqueado la reproducción. Toca el disco otra vez.";
    }
  }else{
    audio.pause();
    playing=false;
    disc.classList.remove("playing");
    icon.textContent="▶";
    hint.textContent="Toca para reanudar";
  }
});

audio.addEventListener("ended",()=>{
  playing=false;
  disc.classList.remove("playing");
  icon.textContent="▶";
  hint.textContent="Toca para volver a escuchar";
});

audio.addEventListener("error",()=>{
  playing=false;
  disc.classList.remove("playing");
  icon.textContent="▶";
  hint.textContent="Error de reproducción";
  errorMsg.textContent="El preview no se puede reproducir.";
});

revealBtn.addEventListener("click",()=>{
  revealBox.classList.add("show");
  revealBtn.disabled=true;
});

loadSong().catch(showError);
</script>
</body>
</html>
