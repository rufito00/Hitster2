<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1e1e2f,#0a0a12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
.card{width:90%;max-width:420px;background:#15151f;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #2a2a3a}
.disc{width:200px;height:200px;margin:0 auto 24px;border-radius:50%;background:repeating-radial-gradient(circle,#333 0,#333 2px,#1a1a1a 3px,#1a1a1a 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:manipulation}
.disc.playing{animation:spin 6s linear infinite}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.disc .icon{font-size:34px}.disc .hint{font-size:12px;color:#999;margin-top:6px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:600;margin-top:12px;cursor:pointer;background:#2a2a3a;color:#fff;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.reveal{margin-top:20px;display:none}.reveal.show{display:block}.reveal .year{font-size:40px;font-weight:800;color:#1DB954}.reveal .title{font-size:20px;font-weight:700;margin-top:6px}.reveal .artist{font-size:15px;color:#999;margin-top:2px}
.error{color:#ff6b6b;font-size:14px;margin-top:16px;line-height:1.4}.loading{color:#888;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<div class="disc" id="disc"><div class="icon" id="icon">▶</div><div class="hint" id="hint">Cargando...</div></div>
<button id="revealBtn" disabled>🔍 Revelar</button>
<div class="reveal" id="revealBox"><div class="year" id="revealYear"></div><div class="title" id="revealTitle"></div><div class="artist" id="revealArtist"></div></div>
<div class="loading" id="loadingMsg"></div><div class="error" id="errorMsg"></div>
</div>
<audio id="audioPlayer" preload="none"></audio>

<script>
const params=new URLSearchParams(location.search);
const title=(params.get('t')||'').trim();
const artist=(params.get('a')||'').trim();
const year=(params.get('y')||'').trim();
const country=(params.get('c')||'ES').trim().toUpperCase();

const disc=document.getElementById('disc');
const icon=document.getElementById('icon');
const hint=document.getElementById('hint');
const revealBtn=document.getElementById('revealBtn');
const errorMsg=document.getElementById('errorMsg');
const loadingMsg=document.getElementById('loadingMsg');
const audio=document.getElementById('audioPlayer');

let previewUrl=null,playing=false;

function jsonp(url,timeoutMs=10000){
 return new Promise((resolve,reject)=>{
  const cb='hitsterCB_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const script=document.createElement('script');
  let finished=false;
  const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove()};
  const fail=e=>{if(finished)return;finished=true;cleanup();reject(e instanceof Error?e:new Error(String(e)))};
  const timer=setTimeout(()=>fail(new Error('TIMEOUT')),timeoutMs);
  window[cb]=data=>{if(finished)return;finished=true;cleanup();resolve(data)};
  script.onerror=()=>fail(new Error('No se pudo contactar con iTunes'));
  script.src=url+'&callback='+encodeURIComponent(cb);
  document.body.appendChild(script);
 });
}

function normalize(s){
 return (s||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\p{L}\p{N}\s]/gu,' ')
  .replace(/\s+/g,' ').trim();
}

function scoreResult(r){
 const wantedTitle=normalize(title), wantedArtist=normalize(artist);
 const rt=normalize(r.trackName), ra=normalize(r.artistName);
 let score=0;
 if(rt===wantedTitle)score+=100;
 else if(rt.includes(wantedTitle)||wantedTitle.includes(rt))score+=60;
 if(ra===wantedArtist)score+=100;
 else if(ra.includes(wantedArtist)||wantedArtist.includes(ra))score+=60;
 if(r.previewUrl)score+=20;
 if(r.kind==='song')score+=10;
 return score;
}

async function search(term){
 const url='https://itunes.apple.com/search?term='+encodeURIComponent(term)+
 '&media=music&entity=song&limit=25&country='+encodeURIComponent(country)+
 '&lang=es_es&version=2';
 return await jsonp(url);
}

async function findPreview(){
 const queries=[
  `${artist} ${title}`,
  `"${title}" "${artist}"`,
  title,
  artist
 ];
 const candidates=[];
 for(const q of queries){
  try{
   const data=await search(q);
   if(data&&Array.isArray(data.results)) candidates.push(...data.results);
  }catch(e){console.warn('Búsqueda fallida:',q,e)}
 }
 const unique=[];
 const seen=new Set();
 for(const r of candidates){
  const key=r.trackId||r.previewUrl||((r.trackName||'')+'|'+(r.artistName||''));
  if(!seen.has(key)){seen.add(key);unique.push(r)}
 }
 unique.sort((a,b)=>scoreResult(b)-scoreResult(a));
 const best=unique.find(r=>r.previewUrl);
 if(!best)throw new Error('NO_PREVIEW');
 return best;
}

function showError(msg){
 loadingMsg.textContent='';
 errorMsg.textContent=msg;
 hint.textContent='No disponible';
 revealBtn.disabled=true;
}

async function init(){
 if(!title||!artist){
  showError('Faltan "t" (título) y "a" (artista) en la URL.');
  return;
 }
 loadingMsg.textContent='Buscando canción...';
 try{
  const result=await findPreview();
  previewUrl=result.previewUrl;
  audio.src=previewUrl;
  audio.load();
  loadingMsg.textContent='';
  errorMsg.textContent='';
  icon.textContent='▶';
  hint.textContent='Toca para reproducir';
 }catch(e){
  console.error(e);
  showError('No he encontrado un preview reproducible para esta canción en iTunes.');
 }
}

disc.addEventListener('click',async()=>{
 if(!previewUrl)return;
 if(!playing){
  try{
   await audio.play();
   playing=true;disc.classList.add('playing');icon.textContent='🔊';hint.textContent='Sonando...';revealBtn.disabled=false;
  }catch(e){errorMsg.textContent='El navegador ha bloqueado la reproducción. Toca otra vez el disco.'}
 }else{
  audio.pause();playing=false;disc.classList.remove('playing');icon.textContent='▶';hint.textContent='Toca para reanudar';
 }
});

audio.addEventListener('ended',()=>{
 playing=false;disc.classList.remove('playing');icon.textContent='▶';hint.textContent='Toca para volver a escuchar';
});

audio.addEventListener('error',()=>{
 playing=false;disc.classList.remove('playing');icon.textContent='▶';hint.textContent='Error de reproducción';
 errorMsg.textContent='Se encontró la canción, pero el preview no se puede reproducir.';
});

revealBtn.addEventListener('click',()=>{
 document.getElementById('revealYear').textContent=year;
 document.getElementById('revealTitle').textContent=title;
 document.getElementById('revealArtist').textContent=artist;
 document.getElementById('revealBox').classList.add('show');
 revealBtn.disabled=true;
});

init();
</script>
</body>
</html>
