<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitster</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(92%,420px);padding:30px 24px;border:1px solid #29293a;border-radius:24px;background:#171722;text-align:center;box-shadow:0 20px 60px #0008}
.disc{width:200px;height:200px;margin:auto;border-radius:50%;background:repeating-radial-gradient(circle,#3a3a3a 0 2px,#181818 3px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.playing{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:34px}.hint{font-size:13px;color:#aaa;margin-top:6px}
button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:17px;font-weight:700}button:disabled{opacity:.4}
#status{min-height:20px;margin-top:16px;color:#aaa;font-size:14px}.error{color:#ff7070!important}
.answer{display:none;margin-top:22px}.answer.show{display:block}.year{font-size:42px;font-weight:800;color:#1db954}.title{font-size:21px;font-weight:700;margin-top:5px}.artist{color:#aaa;margin-top:4px}
</style>

<style>
#ht-home{width:min(92%,420px);margin:0 auto 20px;text-align:center}
#ht-home h1{margin:0 0 16px}
#ht-home button{width:100%;margin:7px 0;padding:14px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:16px;font-weight:700}
#ht-home .ht-pl{background:#252536}
#ht-home .ht-pl.sel{outline:2px solid #fff}
#ht-home .ht-small{color:#aaa;font-size:13px;margin:10px 0}
#ht-game{display:none;width:min(92%,420px);margin:0 auto;text-align:center}
#ht-game button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#303044;color:#fff;font-size:16px;font-weight:700}
#ht-game .ht-answer{display:none;margin-top:18px}
#ht-game .ht-answer.show{display:block}
#ht-game .ht-year{font-size:42px;font-weight:800;color:#1db954}
#ht-game .ht-title{font-size:21px;font-weight:700}
#ht-game .ht-artist{color:#aaa;margin-top:4px}
#ht-game .ht-disc{width:200px;height:200px;margin:12px auto;border-radius:50%;background:repeating-radial-gradient(circle,#3a3a3a 0 2px,#181818 3px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>

<div id="ht-home">
<h1>🎵 HITSTER</h1>
<div class="ht-small">ELIGE PLAYLIST</div>
<div id="ht-playlists"></div>
<button id="ht-all">⚫ TODAS LAS PLAYLISTS</button>
<div id="ht-selected" class="ht-small">Playlist: Todas</div>
<div class="ht-small">MODO DE JUEGO</div>
<button id="ht-random">🎲 CANCIÓN ALEATORIA</button>
<button id="ht-number">🔢 SACAR NÚMERO</button>
<button id="ht-artist">🎤 ADIVINA EL ARTISTA</button>
<button id="ht-song">🎵 ADIVINA LA CANCIÓN</button>
<button id="ht-streak">🔥 RACHA</button>
</div>
<div id="ht-game">
<h1 id="ht-mode">🎲 Juego</h1>
<div id="ht-info" class="ht-small"></div>
<div id="ht-disc" class="ht-disc"><div id="ht-icon" class="icon">▶</div><div id="ht-hint" class="hint">Cargando...</div></div>
<div id="ht-status" class="ht-small"></div>
<button id="ht-reveal">🔍 REVELAR</button>
<div id="ht-answer" class="ht-answer"><div id="ht-year" class="ht-year"></div><div id="ht-song-title" class="ht-title"></div><div id="ht-song-artist" class="ht-artist"></div></div>
<button id="ht-next">➡️ SIGUIENTE</button>
<button id="ht-back">⬅️ VOLVER</button>
</div>
<div class="card">
<div class="disc" id="disc"><div class="icon" id="icon">▶</div><div class="hint" id="hint">Cargando carta...</div></div>
<button id="reveal" disabled>🔍 Revelar</button>
<div id="status"></div>
<div class="answer" id="answer"><div class="year" id="year"></div><div class="title" id="title"></div><div class="artist" id="artist"></div></div>
</div>
<audio id="audio" preload="auto" playsinline></audio>

<script>
const p=new URLSearchParams(location.search);
const id=(p.get("id")||"").trim().padStart(3,"0");
const status=document.getElementById("status"),disc=document.getElementById("disc"),icon=document.getElementById("icon"),hint=document.getElementById("hint");
const reveal=document.getElementById("reveal"),answer=document.getElementById("answer"),audio=document.getElementById("audio");
let song=null,preview=null,playing=false;

function norm(s){
 return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}

async function getSong(){
 const r=await fetch("./songs.json?x="+Date.now(),{cache:"no-store"});
 if(!r.ok) throw new Error("No se puede cargar songs.json ("+r.status+")");
 const list=await r.json();
 song=list.find(x=>String(x.id).padStart(3,"0")===id);
 if(!song) throw new Error("No existe la carta "+id);
 document.getElementById("year").textContent=song.year;
 document.getElementById("title").textContent=song.title;
 document.getElementById("artist").textContent=song.artist;
}

async function deezer(){
 const q=encodeURIComponent(song.artist+" "+song.title);
 const d=await jsonp("https://api.deezer.com/search?q="+q+"&limit=25&output=jsonp");
 const t=norm(song.title),a=norm(song.artist);
 const arr=(d.data||[]).filter(x=>x.preview);
 arr.sort((x,y)=>{
   const sx=(norm(x.title)===t?100:0)+(norm(x.artist?.name)===a?100:0);
   const sy=(norm(y.title)===t?100:0)+(norm(y.artist?.name)===a?100:0);
   return sy-sx;
 });
 if(!arr.length) throw new Error("Sin preview en Deezer");
 return arr[0].preview;
}

function jsonp(url,timeout=9000){
 return new Promise((resolve,reject)=>{
  const cb="hitster_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const s=document.createElement("script"); let done=false;
  const clean=()=>{clearTimeout(timer);delete window[cb];s.remove()};
  const fail=e=>{if(done)return;done=true;clean();reject(e)};
  const timer=setTimeout(()=>fail(new Error("timeout")),timeout);
  window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
  s.onerror=()=>fail(new Error("network"));
  s.src=url+"&callback="+cb;
  document.body.appendChild(s);
 });
}

async function itunes(){
 const q=encodeURIComponent(song.artist+" "+song.title);
 const u="https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=25&country=ES&lang=es_es";
 const d=await jsonp(u);
 const t=norm(song.title),a=norm(song.artist);
 const arr=(d.results||[]).filter(x=>x.previewUrl);
 arr.sort((x,y)=>{
   const sx=(norm(x.trackName)===t?100:0)+(norm(x.artistName)===a?100:0);
   const sy=(norm(y.trackName)===t?100:0)+(norm(y.artistName)===a?100:0);
   return sy-sx;
 });
 if(!arr.length) throw new Error("Sin preview en iTunes");
 return arr[0].previewUrl;
}

async function init(){
 try{
  if(!id) throw new Error("Usa una URL como ?id=004");
  await getSong();
  status.textContent="Buscando canción...";
  try{preview=await deezer()}catch(e){console.warn("Deezer:",e);preview=await itunes()}
  audio.src=preview;
  audio.load();
  status.textContent="";
  hint.textContent="Toca para reproducir";
  reveal.disabled=false;
 }catch(e){
  console.error(e);
  status.textContent=e.message;
  status.className="error";
  hint.textContent="No disponible";
 }
}

disc.onclick=async()=>{
 if(!preview)return;
 try{
  if(!playing){await audio.play();playing=true;disc.classList.add("playing");icon.textContent="🔊";hint.textContent="Sonando..."}
  else{audio.pause();playing=false;disc.classList.remove("playing");icon.textContent="▶";hint.textContent="Toca para reanudar"}
 }catch(e){status.textContent="Toca otra vez el disco para iniciar el audio.";status.className="error"}
};
audio.onended=()=>{playing=false;disc.classList.remove("playing");icon.textContent="▶";hint.textContent="Toca para volver a escuchar"};
audio.onerror=()=>{status.textContent="La fuente de audio no permite reproducir este preview.";status.className="error";playing=false;disc.classList.remove("playing")};
reveal.onclick=()=>{answer.classList.add("show");reveal.disabled=true};
init();
</script>

<script>
(function(){
const PLAYLISTS_URL="./playlists.json?v="+Date.now();
let HT={}, selected=null, mode=null, current=null, audio2=new Audio(), preview2=null, streak=0, playing2=false;
const params=new URLSearchParams(location.search);
const hasId=!!(params.get("id")||"").trim();
const home=document.getElementById("ht-home"), game=document.getElementById("ht-game");
if(hasId) home.style.display="none";

async function loadPlaylists(){
 const r=await fetch(PLAYLISTS_URL,{cache:"no-store"});
 if(!r.ok) throw new Error("No se puede cargar playlists.json ("+r.status+")");
 HT=(await r.json()).playlists||{};
 const box=document.getElementById("ht-playlists");
 Object.keys(HT).forEach(name=>{
  const b=document.createElement("button");
  b.className="ht-pl";
  b.textContent="🎵 "+name+" ("+HT[name].length+")";
  b.onclick=()=>{
   selected=name;
   document.querySelectorAll(".ht-pl").forEach(x=>x.classList.remove("sel"));
   b.classList.add("sel");
   document.getElementById("ht-selected").textContent="Playlist: "+name+" · "+HT[name].length+" canciones";
  };
  box.appendChild(b);
 });
}
function pool(){ return selected ? HT[selected] : Object.values(HT).flat(); }
function pick(){const a=pool();return a[Math.floor(Math.random()*a.length)];}
function number(){return String(Math.floor(Math.random()*400)+1).padStart(3,"0");}

function jsonp2(url,timeout=9000){
 return new Promise((resolve,reject)=>{
  const cb="ht2_"+Date.now()+"_"+Math.random().toString(36).slice(2), s=document.createElement("script");
  let done=false;
  const clean=()=>{clearTimeout(t);delete window[cb];s.remove()};
  const fail=e=>{if(done)return;done=true;clean();reject(e)};
  const t=setTimeout(()=>fail(new Error("timeout")),timeout);
  window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
  s.onerror=()=>fail(new Error("network"));
  s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
  document.body.appendChild(s);
 });
}
function norm2(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();}
async function previewFor(s){
 const q=encodeURIComponent((s.artist||"")+" "+(s.title||""));
 try{
  const d=await jsonp2("https://api.deezer.com/search?q="+q+"&limit=25&output=jsonp");
  const t=norm2(s.title),a=norm2(s.artist);
  const arr=(d.data||[]).filter(x=>x.preview);
  arr.sort((x,y)=>((norm2(x.title)===t?100:0)+(norm2(x.artist?.name)===a?100:0))-((norm2(y.title)===t?100:0)+(norm2(y.artist?.name)===a?100:0)));
  if(arr[0]) return arr[0].preview;
 }catch(e){}
 const d=await jsonp2("https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=25&country=ES&lang=es_es");
 const t=norm2(s.title),a=norm2(s.artist);
 const arr=(d.results||[]).filter(x=>x.previewUrl);
 arr.sort((x,y)=>((norm2(x.trackName)===t?100:0)+(norm2(x.artistName)===a?100:0))-((norm2(y.trackName)===t?100:0)+(norm2(y.artistName)===a?100:0)));
 if(!arr[0]) throw new Error("Sin preview");
 return arr[0].previewUrl;
}
async function start(m){
 if(m==="number"){alert("🎲 Número: "+number());return;}
 mode=m; home.style.display="none"; game.style.display="block";
 document.getElementById("ht-mode").textContent=m==="artist"?"🎤 Adivina el artista":m==="song"?"🎵 Adivina la canción":m==="streak"?"🔥 Racha: 0":"🎲 Canción aleatoria";
 document.getElementById("ht-info").textContent="Playlist: "+(selected||"Todas");
 await round();
}
async function round(){
 current=pick(); preview2=null; playing2=false;
 document.getElementById("ht-answer").classList.remove("show");
 document.getElementById("ht-reveal").disabled=true;
 document.getElementById("ht-status").textContent="Buscando preview...";
 document.getElementById("ht-hint").textContent="Cargando...";
 try{preview2=await previewFor(current);audio2.src=preview2;audio2.load();document.getElementById("ht-status").textContent="";document.getElementById("ht-hint").textContent="Toca para escuchar";document.getElementById("ht-reveal").disabled=false;}
 catch(e){document.getElementById("ht-status").textContent="No hay preview. Pulsa siguiente.";}
}
document.getElementById("ht-disc").onclick=async()=>{if(!preview2)return;try{if(!playing2){await audio2.play();playing2=true;document.getElementById("ht-icon").textContent="🔊";}else{audio2.pause();playing2=false;document.getElementById("ht-icon").textContent="▶";}}catch(e){}};
document.getElementById("ht-reveal").onclick=()=>{document.getElementById("ht-year").textContent="";document.getElementById("ht-song-title").textContent=current.title||"";document.getElementById("ht-song-artist").textContent=current.artist||"";document.getElementById("ht-answer").classList.add("show");document.getElementById("ht-reveal").disabled=true;};
document.getElementById("ht-next").onclick=async()=>{if(mode==="streak"){streak++;document.getElementById("ht-mode").textContent="🔥 Racha: "+streak;}await round();};
document.getElementById("ht-back").onclick=()=>{audio2.pause();game.style.display="none";home.style.display="block";};
document.getElementById("ht-random").onclick=()=>start("random");
document.getElementById("ht-number").onclick=()=>start("number");
document.getElementById("ht-artist").onclick=()=>start("artist");
document.getElementById("ht-song").onclick=()=>start("song");
document.getElementById("ht-streak").onclick=()=>{streak=0;start("streak");};
loadPlaylists().catch(e=>document.getElementById("ht-selected").textContent="Error: "+e.message);
})();
</script>
</body>
</html>
