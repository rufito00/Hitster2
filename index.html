<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .card {
    width: 90%;
    max-width: 420px;
    background: #15151f;
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #2a2a3a;
  }
  .disc {
    width: 120px;
    height: 120px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #333 0, #333 2px, #1a1a1a 3px, #1a1a1a 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 6s linear infinite paused;
  }
  .disc.playing { animation-play-state: running; }
  .disc-hole { width: 18px; height: 18px; border-radius: 50%; background: #0a0a12; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
  }
  #playBtn { background: #1DB954; color: #fff; }
  #revealBtn { background: #2a2a3a; color: #fff; }
  #revealBtn:disabled { opacity: 0.4; }

  .reveal {
    margin-top: 20px;
    display: none;
  }
  .reveal.show { display: block; }
  .reveal .year { font-size: 40px; font-weight: 800; color: #1DB954; }
  .reveal .title { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .reveal .artist { font-size: 15px; color: #999; margin-top: 2px; }

  .hidden-player {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="disc" id="disc"><div class="disc-hole"></div></div>

  <button id="playBtn">▶ Reproducir</button>
  <button id="revealBtn" disabled>🔍 Revelar</button>

  <div class="reveal" id="revealBox">
    <div class="year" id="revealYear"></div>
    <div class="title" id="revealTitle"></div>
    <div class="artist" id="revealArtist"></div>
  </div>

  <div id="playerHost" class="hidden-player"></div>
  <div class="error" id="errorMsg"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const spotifyId = params.get('sid');   // Spotify track ID
  const title = params.get('t') || '';
  const artist = params.get('a') || '';
  const year = params.get('y') || '';

  const playBtn = document.getElementById('playBtn');
  const revealBtn = document.getElementById('revealBtn');
  const disc = document.getElementById('disc');
  const errorMsg = document.getElementById('errorMsg');

  if (!spotifyId) {
    errorMsg.textContent = 'Falta el parámetro "sid" (Spotify Track ID) en la URL.';
    playBtn.disabled = true;
  }

  playBtn.addEventListener('click', () => {
    if (!spotifyId) return;
    const host = document.getElementById('playerHost');
    if (!host.hasChildNodes()) {
      const iframe = document.createElement('iframe');
      iframe.src = `https://open.spotify.com/embed/track/${spotifyId}?utm_source=generator&autoplay=1`;
      iframe.width = '1';
      iframe.height = '1';
      iframe.frameBorder = '0';
      iframe.allow = 'autoplay; encrypted-media';
      host.appendChild(iframe);
    }
    disc.classList.add('playing');
    playBtn.textContent = '🔊 Sonando...';
    revealBtn.disabled = false;
  });

  revealBtn.addEventListener('click', () => {
    document.getElementById('revealYear').textContent = year;
    document.getElementById('revealTitle').textContent = title;
    document.getElementById('revealArtist').textContent = artist;
    document.getElementById('revealBox').classList.add('show');
    revealBtn.disabled = true;
  });
</script>

</body>
</html>
