<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .card {
    width: 90%;
    max-width: 420px;
    background: #15151f;
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #2a2a3a;
  }

  .disc {
    width: 200px;
    height: 200px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #333 0, #333 2px, #1a1a1a 3px, #1a1a1a 8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .disc.playing { animation: spin 6s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .disc .icon { font-size: 34px; }
  .disc .hint { font-size: 12px; color: #999; margin-top: 6px; }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
    background: #2a2a3a;
    color: #fff;
  }
  button:disabled { opacity: 0.4; }

  .reveal { margin-top: 20px; display: none; }
  .reveal.show { display: block; }
  .reveal .year { font-size: 40px; font-weight: 800; color: #1DB954; }
  .reveal .title { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .reveal .artist { font-size: 15px; color: #999; margin-top: 2px; }

  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
  .loading { color: #888; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="disc" id="disc">
    <div class="icon" id="icon">▶</div>
    <div class="hint" id="hint">Cargando...</div>
  </div>

  <button id="revealBtn" disabled>🔍 Revelar</button>

  <div class="reveal" id="revealBox">
    <div class="year" id="revealYear"></div>
    <div class="title" id="revealTitle"></div>
    <div class="artist" id="revealArtist"></div>
  </div>

  <div class="loading" id="loadingMsg"></div>
  <div class="error" id="errorMsg"></div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('t') || '';
  const artist = params.get('a') || '';
  const year = params.get('y') || '';
  const country = params.get('c') || 'ES';

  const disc = document.getElementById('disc');
  const icon = document.getElementById('icon');
  const hint = document.getElementById('hint');
  const revealBtn = document.getElementById('revealBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loadingMsg = document.getElementById('loadingMsg');
  const audio = document.getElementById('audioPlayer');

  let previewUrl = null;
  let playing = false;

  function jsonp(url, callbackName, timeoutMs) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error('TIMEOUT'));
        delete window[callbackName];
        script.remove();
      }, timeoutMs);
      window[callbackName] = (data) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(data);
        delete window[callbackName];
        script.remove();
      };
      script.onerror = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error('ONERROR'));
        delete window[callbackName];
        script.remove();
      };
      script.src = url;
      document.body.appendChild(script);
    });
  }

  async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      const r = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      return r;
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  async function fetchViaProxy(itunesUrl) {
    const proxies = [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(itunesUrl),
      'https://corsproxy.io/?url=' + encodeURIComponent(itunesUrl),
      'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(itunesUrl)
    ];
    let lastErr;
    for (const proxied of proxies) {
      try {
        const r = await fetchWithTimeout(proxied, 6000);
        if (!r.ok) { lastErr = new Error('Proxy HTTP ' + r.status); continue; }
        const data = await r.json();
        return data;
      } catch (e) {
        lastErr = e;
        continue;
      }
    }
    throw lastErr || new Error('Todos los proxies fallaron');
  }

  if (!title || !artist) {
    errorMsg.textContent = 'Faltan los parámetros "t" (título) y "a" (artista) en la URL.';
  } else {
    loadingMsg.textContent = 'Buscando canción...';
    const term = encodeURIComponent(`${artist} ${title}`);
    const itunesUrl = `https://itunes.apple.com/search?term=${term}&media=music&limit=1&country=${country}`;

    fetchViaProxy(itunesUrl)
      .then(data => {
        loadingMsg.textContent = '';
        if (data.results && data.results.length > 0 && data.results[0].previewUrl) {
          previewUrl = data.results[0].previewUrl;
          audio.src = previewUrl;
          icon.textContent = '▶';
          hint.textContent = 'Toca para reproducir';
        } else {
          errorMsg.textContent = 'iTunes respondió pero sin preview. resultCount=' + (data.resultCount ?? '?');
          hint.textContent = 'No disponible';
        }
      })
      .catch(err => {
        loadingMsg.textContent = '';
        errorMsg.textContent = 'FALLO: ' + err.message;
        hint.textContent = 'Error';
        console.error('URL usada:', itunesUrl);
      });
  }

  disc.addEventListener('click', () => {
    if (!previewUrl) return;
    if (!playing) {
      audio.play();
      playing = true;
      disc.classList.add('playing');
      icon.textContent = '🔊';
      hint.textContent = 'Sonando...';
      revealBtn.disabled = false;
    } else {
      audio.pause();
      playing = false;
      disc.classList.remove('playing');
      icon.textContent = '▶';
      hint.textContent = 'Toca para reanudar';
    }
  });

  audio.addEventListener('ended', () => {
    playing = false;
    disc.classList.remove('playing');
    icon.textContent = '▶';
    hint.textContent = 'Toca para reanudar';
  });

  revealBtn.addEventListener('click', () => {
    document.getElementById('revealYear').textContent = year;
    document.getElementById('revealTitle').textContent = title;
    document.getElementById('revealArtist').textContent = artist;
    document.getElementById('revealBox').classList.add('show');
    revealBtn.disabled = true;
  });
</script>

</body>
</html>
