<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .card {
    width: 90%;
    max-width: 420px;
    background: #15151f;
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #2a2a3a;
  }
  .disc {
    width: 200px;
    height: 200px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #333 0, #333 2px, #1a1a1a 3px, #1a1a1a 8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .disc.playing { animation: spin 6s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .disc .icon { font-size: 34px; }
  .disc .hint { font-size: 12px; color: #999; margin-top: 6px; }
  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
    background: #2a2a3a;
    color: #fff;
    touch-action: manipulation;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .reveal { margin-top: 20px; display: none; }
  .reveal.show { display: block; }
  .reveal .year { font-size: 40px; font-weight: 800; color: #1DB954; }
  .reveal .title { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .reveal .artist { font-size: 15px; color: #999; margin-top: 2px; }
  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; line-height: 1.4; }
  .loading { color: #888; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="disc" id="disc" role="button" aria-label="Reproducir canción">
    <div class="icon" id="icon">▶</div>
    <div class="hint" id="hint">Cargando...</div>
  </div>

  <button id="revealBtn" disabled>🔍 Revelar</button>

  <div class="reveal" id="revealBox">
    <div class="year" id="revealYear"></div>
    <div class="title" id="revealTitle"></div>
    <div class="artist" id="revealArtist"></div>
  </div>

  <div class="loading" id="loadingMsg"></div>
  <div class="error" id="errorMsg"></div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
  const params = new URLSearchParams(window.location.search);

  const title = (params.get('t') || '').trim();
  const artist = (params.get('a') || '').trim();
  const year = (params.get('y') || '').trim();
  const country = (params.get('c') || 'ES').trim().toUpperCase();

  const disc = document.getElementById('disc');
  const icon = document.getElementById('icon');
  const hint = document.getElementById('hint');
  const revealBtn = document.getElementById('revealBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loadingMsg = document.getElementById('loadingMsg');
  const audio = document.getElementById('audioPlayer');

  let previewUrl = null;
  let playing = false;

  // iTunes permite JSONP para peticiones cross-origin desde una página web.
  function jsonp(url, timeoutMs = 10000) {
    return new Promise((resolve, reject) => {
      const callbackName =
        '__hitster_itunes_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const script = document.createElement('script');
      let done = false;

      const cleanup = () => {
        clearTimeout(timer);
        delete window[callbackName];
        script.remove();
      };

      const fail = (message) => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error(message));
      };

      const timer = setTimeout(() => fail('iTunes tardó demasiado en responder.'), timeoutMs);

      window[callbackName] = (data) => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };

      script.onerror = () => fail('No se pudo contactar con iTunes.');

      script.src = url + '&callback=' + encodeURIComponent(callbackName);
      document.body.appendChild(script);
    });
  }

  async function findPreview() {
    const term = encodeURIComponent(`${artist} ${title}`);

    const url =
      `https://itunes.apple.com/search` +
      `?term=${term}` +
      `&media=music` +
      `&entity=song` +
      `&limit=10` +
      `&country=${encodeURIComponent(country)}` +
      `&lang=es_es`;

    const data = await jsonp(url);

    if (!data || !Array.isArray(data.results)) {
      throw new Error('Respuesta inválida de iTunes.');
    }

    // Primero intentamos encontrar una coincidencia razonablemente exacta.
    const wantedTitle = title.toLowerCase();
    const wantedArtist = artist.toLowerCase();

    const exact = data.results.find(result => {
      const resultTitle = (result.trackName || '').toLowerCase();
      const resultArtist = (result.artistName || '').toLowerCase();

      return result.previewUrl &&
        (resultTitle === wantedTitle || resultTitle.includes(wantedTitle) || wantedTitle.includes(resultTitle)) &&
        (resultArtist === wantedArtist || resultArtist.includes(wantedArtist) || wantedArtist.includes(resultArtist));
    });

    if (exact && exact.previewUrl) return exact.previewUrl;

    // Si no hay coincidencia exacta, usamos el primer resultado con preview.
    const fallback = data.results.find(result => result.previewUrl);

    if (fallback) return fallback.previewUrl;

    throw new Error(
      `No hay preview disponible para "${title}" de ${artist}.`
    );
  }

  function showError(message) {
    loadingMsg.textContent = '';
    errorMsg.textContent = message;
    hint.textContent = 'No disponible';
    revealBtn.disabled = true;
  }

  async function init() {
    if (!title || !artist) {
      showError('Faltan los parámetros "t" (título) y "a" (artista) en la URL.');
      return;
    }

    loadingMsg.textContent = 'Buscando canción...';
    errorMsg.textContent = '';

    try {
      previewUrl = await findPreview();

      audio.src = previewUrl;
      audio.load();

      loadingMsg.textContent = '';
      icon.textContent = '▶';
      hint.textContent = 'Toca para reproducir';
    } catch (err) {
      console.error(err);
      showError('No he encontrado un preview reproducible de esta canción.');
    }
  }

  disc.addEventListener('click', async () => {
    if (!previewUrl) return;

    if (!playing) {
      try {
        await audio.play();
        playing = true;
        disc.classList.add('playing');
        icon.textContent = '🔊';
        hint.textContent = 'Sonando...';
        revealBtn.disabled = false;
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'El navegador ha bloqueado la reproducción. Toca otra vez el disco.';
      }
    } else {
      audio.pause();
      playing = false;
      disc.classList.remove('playing');
      icon.textContent = '▶';
      hint.textContent = 'Toca para reanudar';
    }
  });

  audio.addEventListener('ended', () => {
    playing = false;
    disc.classList.remove('playing');
    icon.textContent = '▶';
    hint.textContent = 'Toca para volver a escuchar';
  });

  audio.addEventListener('error', () => {
    playing = false;
    disc.classList.remove('playing');
    icon.textContent = '▶';
    hint.textContent = 'Error de reproducción';
    errorMsg.textContent = 'iTunes encontró la canción, pero el preview no se puede reproducir ahora.';
  });

  revealBtn.addEventListener('click', () => {
    document.getElementById('revealYear').textContent = year;
    document.getElementById('revealTitle').textContent = title;
    document.getElementById('revealArtist').textContent = artist;
    document.getElementById('revealBox').classList.add('show');
    revealBtn.disabled = true;
  });

  init();
</script>
</body>
</html>
