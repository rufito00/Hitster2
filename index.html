<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Custom</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .card {
    width: 90%;
    max-width: 420px;
    background: #15151f;
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #2a2a3a;
  }

  .playerWrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 24px;
    border-radius: 50%;
    overflow: hidden;
  }
  #spotifyHost { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #333 0, #333 2px, #1a1a1a 3px, #1a1a1a 8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .overlay.playing { animation: spin 6s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .overlay .icon { font-size: 34px; }
  .overlay .hint { font-size: 12px; color: #999; margin-top: 6px; }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
    background: #2a2a3a;
    color: #fff;
  }
  button:disabled { opacity: 0.4; }

  .reveal { margin-top: 20px; display: none; }
  .reveal.show { display: block; }
  .reveal .year { font-size: 40px; font-weight: 800; color: #1DB954; }
  .reveal .title { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .reveal .artist { font-size: 15px; color: #999; margin-top: 2px; }

  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="playerWrap">
    <div id="spotifyHost"></div>
    <div class="overlay" id="overlay">
      <div class="icon" id="icon">▶</div>
      <div class="hint" id="hint">Toca para reproducir</div>
    </div>
  </div>

  <button id="revealBtn" disabled>🔍 Revelar</button>

  <div class="reveal" id="revealBox">
    <div class="year" id="revealYear"></div>
    <div class="title" id="revealTitle"></div>
    <div class="artist" id="revealArtist"></div>
  </div>

  <div class="error" id="errorMsg"></div>
</div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const trackId = params.get('sid');   // Spotify Track ID
  const title = params.get('t') || '';
  const artist = params.get('a') || '';
  const year = params.get('y') || '';

  const overlay = document.getElementById('overlay');
  const icon = document.getElementById('icon');
  const hint = document.getElementById('hint');
  const revealBtn = document.getElementById('revealBtn');
  const errorMsg = document.getElementById('errorMsg');

  if (!trackId) {
    errorMsg.textContent = 'Falta el parámetro "sid" (Spotify Track ID) en la URL.';
  }

  let wasPaused = true;

  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    if (!trackId) return;
    const element = document.getElementById('spotifyHost');
    const options = {
      uri: `spotify:track:${trackId}`,
      width: 240,
      height: 240
    };
    const callback = (EmbedController) => {
      EmbedController.addListener('playback_update', e => {
        const isPaused = e.data.isPaused;
        if (!isPaused && wasPaused) {
          overlay.classList.add('playing');
          icon.textContent = '🔊';
          hint.textContent = 'Sonando...';
          revealBtn.disabled = false;
        } else if (isPaused && !wasPaused) {
          overlay.classList.remove('playing');
          icon.textContent = '▶';
          hint.textContent = 'Toca para reanudar';
        }
        wasPaused = isPaused;
      });
    };
    IFrameAPI.createController(element, options, callback);
  };

  revealBtn.addEventListener('click', () => {
    document.getElementById('revealYear').textContent = year;
    document.getElementById('revealTitle').textContent = title;
    document.getElementById('revealArtist').textContent = artist;
    document.getElementById('revealBox').classList.add('show');
    revealBtn.disabled = true;
  });
</script>

</body>
</html>
